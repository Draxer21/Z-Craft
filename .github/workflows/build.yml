name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: Report errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failed'
            echo '```'
            grep -E -A3 "error:|What went wrong|FAILURE|Exception" build.log | head -c 60000
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: zcraft-jar
          path: build/libs/*.jar
      - name: Publish release (jar downloadable without login)
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mc-'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          tag="v${ver}-mc${MC}"
          notes="Z-Craft ${ver} para Minecraft ${MC} (NeoForge). Se actualiza con cada cambio; último commit: ${GITHUB_SHA::7}."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --title "Z-Craft ${ver} — Minecraft ${MC}" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$jar" --clobber
      - name: Server smoke test
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          printf 'online-mode=false\n' > run/server/server.properties
          ./gradlew runServer > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 150); do
            if grep -q 'Done (' server.log; then echo "Server started"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Server process ended"; break; fi
            sleep 4
          done
          sleep 15
          kill $PID 2>/dev/null || true
          pkill -f 'net.neoforged' 2>/dev/null || true
          {
            if grep -q 'Done (' server.log; then echo '### Server started OK'; else echo '### Server did NOT start'; fi
            echo '```'
            grep -E -i -B1 -A4 "exception|error|failed|couldn't|could not|missing|invalid" server.log \
              | grep -v -E "DEBUG|^\s*at java\.|^\s*at jdk\." | head -c 30000
            echo '```'
          } > server_report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@server_report.md
          grep -q 'Done (' server.log
